name: Build offline Hindi APK
on:
  push:
    paths: [".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install only required SDK packages
        run: |
          mkdir -p "$HOME/android-sdk"
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$HOME/android-sdk"
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv "$HOME/android-sdk/cmdline-tools/"{bin,lib,NOTICE.txt,source.properties} "$HOME/android-sdk/cmdline-tools/latest/"
          set +o pipefail
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-33' 'build-tools;33.0.2'
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
      - name: Restore complete project
        run: |
          printf '%s' '' | base64 -d > source-code.zip
          mkdir project
          unzip -q source-code.zip -d project
      - name: Put reviewable sources in repository
        run: |
          cp -r project/src project/res project/gradle .
          cp project/README.md project/LICENSE project/THIRD_PARTY_NOTICES.md project/build.gradle project/settings.gradle project/gradle.properties project/AndroidManifest.xml project/prepare-model.sh project/gradlew project/gradlew.bat .
          mkdir -p assets
          cp project/assets/greeting.wav assets/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src res gradle assets README.md LICENSE THIRD_PARTY_NOTICES.md build.gradle settings.gradle gradle.properties AndroidManifest.xml prepare-model.sh gradlew gradlew.bat
          git diff --cached --quiet || (git commit -m "Add reviewable Android sources" && git push)
      - name: Build offline model APK
        working-directory: project
        run: |
          chmod +x gradlew prepare-model.sh
          ./prepare-model.sh
          ./gradlew assembleDebug lint --no-daemon
          cp build/outputs/apk/debug/*.apk ../hindi-voicemail-0.2.0-debug.apk
      - name: Enable KVM for Android visual check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator launch and UI screenshots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install hindi-voicemail-0.2.0-debug.apk
            adb shell am start -n org.voicemail.hindi/.MainActivity
            sleep 20
            adb shell pidof org.voicemail.hindi
            adb shell screencap -p /sdcard/ui-top.png
            adb pull /sdcard/ui-top.png ui-top.png
            adb shell input swipe 500 1600 500 450 500
            adb shell screencap -p /sdcard/ui-middle.png
            adb pull /sdcard/ui-middle.png ui-middle.png
            adb shell input swipe 500 1600 500 450 500
            adb shell screencap -p /sdcard/ui-bottom.png
            adb pull /sdcard/ui-bottom.png ui-bottom.png
            adb logcat -d -s AndroidRuntime > emulator-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hindi-voicemail-apk-and-source
          path: |
            hindi-voicemail-0.2.0-debug.apk
            source-code.zip
            ui-*.png
            emulator-log.txt
      - name: Publish experimental APK and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0-alpha >/dev/null 2>&1 || gh release create v0.2.0-alpha --prerelease --title 'Hindi Voicemail v0.2 - English UI, Hindi voice' --notes-file project/README.md
          gh release upload v0.2.0-alpha hindi-voicemail-0.2.0-debug.apk source-code.zip --clobber
          for image in ui-*.png; do [ ! -f "$image" ] || gh release upload v0.2.0-alpha "$image" --clobber; done
